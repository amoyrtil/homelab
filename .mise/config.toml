[env]
KUBECONFIG = "{{config_root}}/talos/clusterconfig/kubeconfig"
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"
# SOPS の age 秘密鍵は sops 既定の ~/.config/sops/age/keys.txt に置く。
# ここで上書きしない。別のマシンで作業するときは、その場所に鍵を配る。

[tools]
age = "1.3.2"
cilium-cli = "0.18.9"
flux2 = "2.9.5"
helm = "4.2.4"
helmfile = "1.7.4"
jq = "1.8.1"
kubectl = "1.37.0"
kustomize = "5.8.1"
opentofu = "1.12.6"
sops = "3.13.3"
talhelper = "3.1.17"
talosctl = "1.14.0"
