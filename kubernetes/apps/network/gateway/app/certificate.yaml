# LAN 内アクセスは Cloudflare を通らないため、Gateway 自身が証明書を出す。
# DNS-01 チャレンジは外部からの到達性を要求しないので、内部専用の
# ホスト名でもワイルドカードで1枚取れる。
#
# staging で1回通したうえで production に切り替えた。
# staging での発行は 2026年9月9日に確認している。
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard
  namespace: network
spec:
  secretName: wildcard-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-production
  dnsNames:
    - "${SECRET_DOMAIN}"
    - "*.${SECRET_DOMAIN}"
