---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 30m
  path: ./kubernetes/apps/longhorn-system/longhorn/app
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    # flux-operator は FluxInstance の名前によらず、GitRepository と
    # 入口の Kustomization を flux-system という名前で作る。
    kind: GitRepository
    name: flux-system
  # decryption は置いていない。app/ に暗号化ファイルが無いためである。
  # フェーズ1で backupstore の cifs-secret を足すときに要る。
