---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 30m
  path: ./kubernetes/apps/longhorn-system/longhorn/app
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux
  decryption:
    provider: sops
    secretRef:
      name: sops-age
