# **Pod Security を restricted まで上げる。**
# Talos の既定は baseline である。cert-manager は Cloudflare の API トークンを
# 持ち、クラスターの証明書を発行する。緩い水準で置く理由がない。
#
# 既存の Pod が restricted を満たすことは R9 で確認済みである
# （kubectl label --dry-run=server が警告を出さない）。
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
