---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: webhook
  namespace: flux-system
spec:
  interval: 30m
  path: ./kubernetes/apps/flux-system/webhook/app
  prune: true
  wait: true
  timeout: 5m
  dependsOn:
    - name: gateway
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
