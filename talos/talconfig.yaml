# yaml-language-server: $schema=https://raw.githubusercontent.com/budimanjojo/talhelper/master/pkg/config/schemas/talconfig.json
---
clusterName: homelab
talosVersion: v1.14.0
kubernetesVersion: v1.37.0
endpoint: https://192.168.20.100:6443

allowSchedulingOnControlPlanes: false

# cp-2 / cp-3 を後から足したときに証明書を作り直さずに済むよう、
# 計画上のアドレスを最初からすべて SAN に含めておく。
additionalApiServerCertSans:
  - 192.168.20.100
  - 192.168.20.31
  - 192.168.20.32
  - 192.168.20.33
  - 127.0.0.1

nodes:
  # cp-1 = morty。内蔵 I226-V は 4-5 / 7-8 ペアの物理層障害があるため USB ドングルを使う。
  # 詳細は docs/plan.md「既知の制約: S100-WLP の NIC 障害と USB NIC による回避」を参照。
  - hostname: cp-1
    ipAddress: 192.168.20.31
    controlPlane: true
    installDisk: /dev/sda # UFS デバイス
    # Talos v1.14 で標準カーネルが UFS に対応したため talos-ufs は不要になった。
    # 拡張を含まない素の schematic を使う。検証の記録は
    # docs/plan.md「Talos v1.14 への移行と talos-ufs の存廃」を参照。
    talosImageURL: factory.talos.dev/metal-installer/376567988ad370138ad8b2698212367b8edcb69b5fd68c80be1f2ec7d603b4ba
    nameservers:
      - 192.168.20.1
    certSANs:
      - 192.168.20.31
      - 192.168.20.100
    networkInterfaces:
      # インターフェース名は USB ポートの位置で変わるため、ドライバで選択する。
      - deviceSelector:
          driver: r8152
        addresses:
          - 192.168.20.31/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.20.1
        vip:
          ip: 192.168.20.100

  # cp-2 = jerry は 2026年9月6日に talos-ufs の要否検証に使い、クラスターから外した。
  # 経緯は docs/plan.md「Talos v1.14 への移行と talos-ufs の存廃」を参照。
  # コントロールプレーンは EliteDesk 800 G6 に置き換えるため、ここには戻さない。

controlPlane:
  patches:
    # フェーズ1の検証専用。認証なしの etcd メトリクスエンドポイントを開ける。
    # 本構築には持ち込まない。
    - |-
      cluster:
        etcd:
          extraArgs:
            listen-metrics-urls: http://0.0.0.0:2381
