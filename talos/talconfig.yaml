# yaml-language-server: $schema=https://raw.githubusercontent.com/budimanjojo/talhelper/master/pkg/config/schemas/talconfig.json
---
clusterName: homelab
talosVersion: v1.14.0
kubernetesVersion: v1.37.0
endpoint: https://192.168.20.100:6443

allowSchedulingOnControlPlanes: false

# Cilium を kube-proxy 置換で入れるため、Talos には CNI も kube-proxy も作らせない。
# どちらもクラスター構築時にしか効かないため、後から変えるとノードの作り直しになる。
cniConfig:
  name: none

# cp-2 / cp-3 を後から足したときに証明書を作り直さずに済むよう、
# 計画上のアドレスを最初からすべて SAN に含めておく。
additionalApiServerCertSans:
  - 192.168.20.100
  - 192.168.20.31
  - 192.168.20.32
  - 192.168.20.33
  - 127.0.0.1

nodes:
  # cp-1 = morty。内蔵 I226-V は 4-5 / 7-8 ペアの物理層障害があるため USB ドングルを使う。
  # 詳細は docs/plan.md「既知の制約: S100-WLP の NIC 障害と USB NIC による回避」を参照。
  - hostname: cp-1
    ipAddress: 192.168.20.31
    controlPlane: true
    installDisk: /dev/sda # UFS デバイス
    # Talos v1.14 で標準カーネルが UFS に対応したため talos-ufs は不要になった。
    # 拡張を含まない素の schematic を使う。検証の記録は
    # docs/plan.md「Talos v1.14 への移行と talos-ufs の存廃」を参照。
    talosImageURL: factory.talos.dev/metal-installer/376567988ad370138ad8b2698212367b8edcb69b5fd68c80be1f2ec7d603b4ba
    nameservers:
      - 192.168.20.1
    certSANs:
      - 192.168.20.31
      - 192.168.20.100
    networkInterfaces:
      # インターフェース名は USB ポートの位置で変わるため、ドライバで選択する。
      - deviceSelector:
          driver: r8152
        addresses:
          - 192.168.20.31/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.20.1
        vip:
          ip: 192.168.20.100

  # cp-2 = jerry は 2026年9月6日に talos-ufs の要否検証に使い、クラスターから外した。
  # 経緯は docs/plan.md「Talos v1.14 への移行と talos-ufs の存廃」を参照。
  # コントロールプレーンは EliteDesk 800 G6 に置き換えるため、ここには戻さない。

  # worker-1 = MS-03。NIC は4つとも認識されている。
  #   eno2      igc    8086:125b  i226-LM 2.5GbE
  #   eno3      r8169  10ec:8127  RTL8127 10GbE RJ-45
  #   eno4np0   i40e   8086:1572  X710 SFP+ #1
  #   eno5np1   i40e   8086:1572  X710 SFP+ #2
  # 現在は X710 の SFP+ #1 に DAC 直結している。名前ではなく MAC で選ぶのは、
  # 4つとも同じ OUI で連番のため、名前の対応が起動順で入れ替わりうるからである。
  - hostname: worker-1
    ipAddress: 192.168.20.41
    controlPlane: false
    installDisk: /dev/nvme0n1 # SKHynix HFS256GDE9X081N 256GB
    talosImageURL: factory.talos.dev/metal-installer/b7f363548fe975dbb10e85983906f0c3f44ab3804b6246b677508ca1bb20d1f4
    nameservers:
      - 192.168.20.1
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: 38:05:25:3b:cc:d3
        addresses:
          - 192.168.20.41/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.20.1

controlPlane:
  patches:
    # kube-proxy は Cilium が置き換えるため作らせない。
    # v1.14 では v1alpha1 の cluster.proxy が KubeProxyConfig ドキュメントと
    # 衝突するため、ドキュメント側の enabled を落とす。
    - |-
      apiVersion: v1alpha1
      kind: KubeProxyConfig
      enabled: false
