# LoadBalancer に払い出す IP の範囲。
# docs/plan.md「VLAN 20 のアドレス割り当て」で確保した帯である。
---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: default
spec:
  blocks:
    - start: 192.168.20.200
      stop: 192.168.20.250
---
# 払い出した IP を L2 で広告する。R4 で BGP に移すまでの確認用。
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: default
spec:
  # ワーカーのみが広告する。コントロールプレーンにワークロードは載らない。
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  interfaces:
    - ^eno[0-9]+.*
  externalIPs: true
  loadBalancerIPs: true
