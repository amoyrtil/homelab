# Flux 本体の構成。flux-operator がこれを読んでコントローラーを展開し、
# Git の同期を始める。Flux 自身を Flux で管理できないため bootstrap 側に置く。
---
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 1h
    fluxcd.controlplane.io/reconcileTimeout: 5m
spec:
  distribution:
    version: 2.x
    registry: ghcr.io/fluxcd
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  cluster:
    type: kubernetes
    networkPolicy: true
  sync:
    kind: GitRepository
    url: https://github.com/amoyrtil/homelab.git
    ref: refs/heads/main
    path: kubernetes/flux/cluster
    # リポジトリが public のため認証は要らない。private に変えるとき、または
    # オーガナイゼーションへ移すときは、Secret を作って pullSecret で指す。
    # 手順は docs/knowledge/flux-bootstrap.md にある。
  # flux-operator が生成するマニフェストにパッチを当てる。
  kustomize:
    patches:
      # 入口の Kustomization に復号の設定を足す。
      # 既定では付かず、kubernetes/flux/cluster に置いた cluster-secrets が
      # 平文にならないまま配下へ渡らない。
      - target:
          kind: Kustomization
        patch: |
          - op: add
            path: /spec/decryption
            value:
              provider: sops
              secretRef:
                name: sops-age

      # flux-system namespace に公開許可のラベルを付ける。
      # external Gateway の allowedRoutes が Selector になっており、
      # このラベルを持つ namespace からの HTTPRoute しか受け付けない。
      # Webhook Receiver がここにいるため、無いと GitHub の push が届かない。
      #
      # **kubectl label では持たない。**
      # flux-operator はこの Namespace を自分の inventory に持っており
      # （status.inventory に _flux-system__Namespace がある）、reconcile の
      # たびに自分の desired state を適用して余所のラベルを剥ぐ。
      # 手で付けたラベルは数時間で消え、その時点で external-dns が
      # ルートの外れたレコードとして CNAME と TXT を削除する。
      # 症状は公開 URL が引けなくなることで、クラスター側は全部 True のままである。
      #
      # ここに書くと flux-operator 自身が維持するため剥がれない。
      - target:
          kind: Namespace
          name: flux-system
        patch: |
          - op: add
            path: /metadata/labels/homelab~1expose
            value: "true"
