! UCG-Fiber の FRR 設定。UniFi の Settings -> Routing -> BGP からアップロードする。
! ASN の割り当ては docs/design.md#bgp にある。
router bgp 65000
 bgp router-id 192.168.20.1
 ! RFC 8212 により、FRR は eBGP に route-map を要求する。落とすとピアは
 ! 張れるのに経路が一切交換されない。症状から原因にたどり着きにくい。
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 !
 ! ノードの IP を列挙せず、VLAN 20 からの接続を待ち受ける。接続を開始するのは
 ! Cilium 側なので、ルーターは待つだけでよい。ノードが増えても両側とも
 ! 設定を変えずに済む。
 neighbor k8s peer-group
 neighbor k8s remote-as 65001
 bgp listen range 192.168.20.0/24 peer-group k8s
 bgp listen limit 16
 !
 address-family ipv4 unicast
  neighbor k8s activate
  neighbor k8s soft-reconfiguration inbound
 exit-address-family
!
